# Beyond DNS (covered namespace-wide elsewhere): apiserver (status/leader
# election), peer instances (replication), minio (WAL/backups).
#
# apiserver target is the control-plane node's real IP:port, not the
# "kubernetes" Service ClusterIP - kube-proxy DNATs before Calico's filter
# table sees the packet, so an ipBlock on the ClusterIP never matches.
# minikube-specific; a real cluster would target its apiserver VIP/LB instead.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres-egress
  namespace: app
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: postgres
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 192.168.49.2/32
      ports:
        - protocol: TCP
          port: 8443
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: minio
      ports:
        - protocol: TCP
          port: 9000
