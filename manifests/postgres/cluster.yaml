apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: app
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:16.4@sha256:99be063781d171d3971089b49c992706bdab9ccbd2b57cdf126c7542773aedfe

  bootstrap:
    initdb:
      database: appdb
      owner: appuser
      secret:
        name: postgres-owner-credentials

  # minikube's default StorageClass ("standard", the legacy hostpath
  # provisioner) doesn't apply fsGroup ownership to its volumes - Kubernetes
  # explicitly exempts the HostPath volume type from fsGroup enforcement, so
  # CNPG's non-root postgres container gets "Permission denied" writing to a
  # PVC on it. csi-hostpath-driver is a real CSI implementation and handles
  # fsGroup correctly.
  storage:
    size: 1Gi
    storageClass: csi-hostpath-sc

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  backup:
    retentionPolicy: "7d"
    barmanObjectStore:
      destinationPath: s3://postgres-backups/postgres-cluster
      endpointURL: http://minio.app.svc.cluster.local:9000
      s3Credentials:
        accessKeyId:
          name: minio-credentials
          key: MINIO_ROOT_USER
        secretAccessKey:
          name: minio-credentials
          key: MINIO_ROOT_PASSWORD
      wal:
        compression: gzip
      data:
        compression: gzip
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: postgres-nightly
  namespace: app
spec:
  # CNPG's schedule is NOT standard 5-field Kubernetes CronJob syntax - it's
  # robfig/cron format with a leading seconds field (sec min hour dom month
  # dow). A 5-field "0 2 * * *" here doesn't mean "2am daily": it gets parsed
  # as sec=0 min=2 hour=* ..., i.e. every hour at :02:00. Confirmed by
  # actually seeing a Backup fire at 17:02 instead of 02:00 - not caught by
  # reading the docs, caught by checking what actually ran.
  schedule: "0 0 2 * * *"
  backupOwnerReference: self
  cluster:
    name: postgres
