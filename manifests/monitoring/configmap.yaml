apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/rules/*.yml

    alerting:
      alertmanagers:
        - static_configs:
            - targets: []

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]

      - job_name: api
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ["app"]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
  alert-rules.yml: |
    groups:
      - name: api
        rules:
          - alert: APITargetDown
            expr: up{job="api"} == 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "API pod {{ $labels.pod }} is not scrapeable"
              description: "Prometheus has not been able to scrape {{ $labels.pod }} in namespace {{ $labels.namespace }} for 2 minutes. The pod is either down or not serving /metrics, which also means it is not serving traffic. Page on-call."
