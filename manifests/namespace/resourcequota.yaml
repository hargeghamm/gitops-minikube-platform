# Sized against worst-case simultaneous usage: api at HPA max (5) + 1 rollout
# surge, both CNPG instances, minio, bucket-job. Worst case ~560m/848Mi
# requests, ~2550m/2112Mi limits. Headroom: ~1.8x requests.cpu, ~1.4x memory,
# ~1.2x limits.cpu (tightest - widen first if needed).
apiVersion: v1
kind: ResourceQuota
metadata:
  name: app-quota
  namespace: app
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 1200Mi
    limits.cpu: "3"
    limits.memory: 3Gi
